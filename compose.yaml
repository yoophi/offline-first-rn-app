services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo-local-only}
      POSTGRES_DB: todo
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - todo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  todo-postgres:
